name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  hub-tests:
    name: Hub (Java / Maven)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run JUnit tests
        run: mvn -B test
        working-directory: hub

  python-tests:
    name: Participants & Copilot (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            participants/requirements.txt
            copilot/requirements.txt

      - name: Install participant dependencies
        run: pip install -r requirements.txt
        working-directory: participants

      - name: Install copilot dependencies
        run: pip install -r requirements.txt
        working-directory: copilot

      - name: Participant tests (reconciliation math)
        run: pytest tests/ -q
        working-directory: participants

      - name: Copilot tests (tool logic)
        run: pytest tests/ -q
        working-directory: copilot
